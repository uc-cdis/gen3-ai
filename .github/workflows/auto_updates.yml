name: Weekly Automatic Updates (docs_and_tools and lock)
on:
  # allow manual runs
  workflow_dispatch:

  # also schedule weekly
  schedule:
    # 9:17AM central time Monday
    # why so specific? probably a lot of people have things scheduled
    # on the half-hour so this avoids load times at 9 / 9:30
    - cron: '17 9 * * 1'
      timezone: "America/Chicago"
permissions:
  contents: write
  pull-requests: write
jobs:
  autoupdate:
    runs-on: ubuntu-latest
    strategy:
      # not failing fast ensures both jobs run, even if one fails
      fail-fast: false
      matrix:
        task: [docs-and-tools, lock]
        include:
          - task: docs-and-tools
            command: |
              # autoupdate API docs
              just openapi
              # update tool versions
              just update_versions
            git_add_files: |
              git add ./docs/api.html
              git add ./docs/autogenerated_openapi.json
              git add ./services/*/docs/autogenerated_openapi.json
              # if existing secrets just moved line numbers
              # note: if detect-secrets actually fails on a NEW false
              # positive secret from the docs generation,
              # this workflow will still fail and require human intervention
              git add .secrets.baseline
            pr_title: "chore(docs-and-tools): update API documentation and tools"
          - task: lock
            command: just lock
            git_add_files: |
              git add '**/uv.lock'
              git add .secrets.baseline
            pr_title: "chore(uv-lock): update uv.lock files"

    env:
      UV_VERSION: '0.11.33'
      JUST_VERSION: '1.57.0'
      PYTHON_VERSION: '3.13'
      PGHOST: 'localhost'
      PGPORT: 5432
      PGUSER: 'postgres'
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          # this uses the default repo-scoped, job-used GITHUB_TOKEN
          # and saves it as git creds for this run only (it's
          # removed in a post cleanup). this ensures
          # future git commands are authed
          persist-credentials: true

      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: python info
        run: python --version

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/${{ env.UV_VERSION }}/install.sh | sh

      - uses: taiki-e/install-action@v2
        with:
          tool: just@${{ env.JUST_VERSION }}

      - name: just setup
        run: |
          just setup

      - name: just install
        run: |
          just install

      # we need node for use of redocly by `just openapi`
      # so use the official GH action for this
      - name: Setup Node (docs-and-tools only)
        if: matrix.task == 'docs-and-tools'
        uses: actions/setup-node@v6

      - name: Run Primary Task Command (Generate docs or relock for Python dep updates)
        run: ${{ matrix.command }}

      # will format and fix files
      - name: format and fix files with `pre-commit run -a`
        run: |
          # force positive exit code.
          # pre-commit errors when files have to be formatted but automatically
          # does the formatting. Also we haven't created a branch yet so that will fail too.
          # So exit successfully here no matter what, and if there
          # is a real issue, it will be captured by the resulting PR automation checks
          # Note: skipping updating versions b/c workflows can't edit workflow files easily
          SKIP=update_versions pre-commit run -a || true

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com

      - name: Check for file changes
        id: check_changes
        run: |
          ${{ matrix.git_add_files }}

          if git diff --cached --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request If Changes Detected
        if: steps.check_changes.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="chore/${{ matrix.task }}-${{ github.run_id }}"
          git checkout -b $BRANCH_NAME

          ${{ matrix.git_add_files }}

          git commit -m "${{ matrix.pr_title }}"
          git push origin $BRANCH_NAME

          # gh CLI is pre-installed in ubuntu-latest
          # NOTE: --draft is required b/c the default GITHUB_TOKEN (which is used here)
          #       will not trigger future `on: push` actions in the resulting PR. This is
          #       a GH-required protection to prevent accidental infinite loops. To work around
          #       this, we make the PR a draft, require a real person to manually "mark it ready"
          #       and then the normal PR workflow actions should run b/c we explicitly
          #       tell it to run on a PR "ready" trigger.
          gh pr create \
            --title "${{ matrix.pr_title }}" \
            --body "Automated update of ${{ matrix.task }}. Mark as 'Ready for Review' to start automated checks!" \
            --head $BRANCH_NAME \
            --draft
