repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: poetry.lock
  - repo: local
    hooks:
    -   id: lint
        name: run all lint checks and show fixes
        entry: uv run just lint all --show-fixes
        language: python
        types: [file]
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: no-commit-to-branch
        args: [--branch, develop, --branch, master, --branch, main, --pattern, release/.*]
  - repo: local
    hooks:
    -   id: update_versions
        # allow an old version with in-line comment: # allow-old-version
        # for example if the latest version is broken, you can temporarily add that
        # so CI will still pass. The check ignores lines with that comment
        name: update tool/workflow versions
        entry: uv run just update_versions
        language: python
        types: [python]
        pass_filenames: false
