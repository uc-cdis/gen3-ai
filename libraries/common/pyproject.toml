[project]
name = "common"
version = "0.1.8"
description = "Gen3 AI Common/Shared Dependencies"
requires-python = "~=3.13.0"
# How to add in-progress branches to test:
#     "{package} @ git+https://github.com/{org}/{repo}.git@{branch}"
#   example:
#     "gen3pyutils @ git+https://github.com/uc-cdis/gen3pyutils.git@feat/metrics-improvements",
dependencies = [
  "asyncpg>=0.31.0",
  "authutils>=9.0.0",
  # The `observability` extra carries the tracing, profiling and request-metrics helpers that
  # common/telemetry.py, common/profiling.py and the services' metrics middleware are built on,
  # along with the OpenTelemetry and Pyroscope packages they need.
  "gen3pyutils[observability]>=3.0.0",
  "click>=8.3.1",
  "fastapi>=0.128.0",
  "gen3authz>=3.0.1",
  "gen3logging>=2.0.0",
  "opentelemetry-api>=1.39.1",
  # 0.66b1 is the first release with HTTPX2ClientInstrumentor (authutils>=9 uses httpx2)
  "opentelemetry-instrumentation-httpx>=0.66b1",
  "opentelemetry-instrumentation-asyncpg>=0.65b0",
  "opentelemetry-instrumentation-requests>=0.65b0",
  "opentelemetry-sdk>=1.39.1",
  "prometheus-client>=0.24.1",
  "pytest>=9.0.2",
  "python-dotenv>=1.2.2",
  "pyyaml>=6.0.3",
  "requests>=2.32.5",
  "ruff>=0.15.6",
  "starlette>=0.52.1",
  "uvicorn>=0.41.0",
  # dev
  # note: putting these here is required b/c common is
  #       installed as a library.
  #
  # At this point, the overhead of including these in the
  # docker images is minimal.. but if we want to shave size
  # at the cost of duplication, we could add all these to
  # each service dev deps instead of the single common
  # location.
  "pytest",
  "pytest-asyncio",
  "ruff",
  "pytest-xdist",
  # `starlette.testclient` imports httpx2 and only falls back to httpx with a deprecation
  # warning, so TestClient needs this. authutils>=9 also requires httpx2 at runtime for its
  # JWKS fetches. gen3authz still requires httpx, a separate distribution, so common/telemetry.py
  # instruments both.
  "httpx2>=2.12.0",
  "pylint>=4.0.5",
  "dotenv>=0.9.9",
  "sqlfluff>=4.2.2",
  # pinned tightly: ty is pre-1.0 and rules change between releases
  "ty>=0.0.69,<0.1",
]

[dependency-groups]
dev = [
  # DO NOT USE THIS!!
  # uv WILL NOT INCLUDE ANYTHING IN THIS "dev" BLOCK
  # IN SERVICE INSTALLATIONS!
  # THERE SHOULD BE NOTHING IN HERE!
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]

[tool.hatch.metadata]
allow-direct-references = true
