# Modified from default ruff config from Astral
#
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 120
indent-width = 4

# Assume Python 3.13
target-version = "py313"

[lint]
select = [
    ## pycodestyle: PEP8 style checker
    # kept ruff defaults here instead of adding everything
    "E4", "E7", "E9",

    ## Pyflakes: statis analysis, looks for errors
    "F",

    ## pyupgrade: using modern Python syntax
    "UP",

    ## flake8-bugbear: bugs / code smells
    # Do not use this for now, too noisy. Need time to refine
    # which codes are useful

    ## flake8-simplify
    # very selective here, a lot of these are too opinionated imo
    "SIM101", "SIM107", "SIM208", "SIM210", "SIM211", "SIM212",
    "SIM220", "SIM221", "SIM222", "SIM223", "SIM300", "SIM401",

    ## isort
    "I",

    ## pydocstyle: docstring presence.
    # D1 is the whole "is a docstring even there" group: D100 module, D101 class, D102 method,
    # D103 function, D104 package, D105 magic method, D106 nested class, D107 `__init__`.
    "D1",

    ## Naming conventions
    "N",
]
ignore = [
    # D212 multi-line-summary-first-line: wants the summary up against the opening `"""`.
    # The opposite of our house style (new line starts docstring), so it is off and D213 below is on instead.
    "D212"
]
# add these back:
extend-select = [
    # D213 multi-line-summary-second-line: a multi-line docstring starts its summary on the
    # line after the opening `"""`. Our house style, and the reason D212 is ignored above.
    "D213",

    # D417 undocumented-param: every parameter appears in the `Args:` section. A weird quirk:
    # This only validates a section that already exists - it does not require one. so a docstring with
    # no `Args:` at all still passes.
    "D417",

    ## pydoclint: the docstring matches what the body actually does. Every DOC rule is
    ## preview-only as of ruff 0.16, hence `preview = true` below.

    # DOC102 docstring-extraneous-parameter: `Args:` documents a name that is not in the
    # signature. Complements D417 rather than duplicating it - D417 catches a parameter added
    # without documentation, DOC102 catches documentation left behind when a parameter is
    # removed, and only a rename trips both.
    "DOC102",
    # DOC201 docstring-missing-returns: the body returns a value but there is no `Returns:`.
    # A one-line docstring whose summary starts with "Return" is accepted as documenting the
    # return, so a short helper does not need the full section.
    "DOC201",
    # DOC202 docstring-extraneous-returns: there is a `Returns:` but the body returns nothing.
    "DOC202",
    # DOC402 docstring-missing-yields: the body yields but there is no `Yields:`.
    "DOC402",
    # DOC403 docstring-extraneous-yields: there is a `Yields:` but the body never yields.
    "DOC403",
    # DOC501 docstring-missing-exception: the body raises an exception type absent from
    # `Raises:`. Only sees `raise` in the function itself, not what its callees raise, so it
    # only ever asks for more documentation - never less.
    "DOC501"

    # DOC502 docstring-extraneous-exception is deliberately NOT selected. It only counts an
    # explicit `raise` in the function itself, so it flags a documented exception that a callee
    # raises on the function's behalf - which is exactly what a caller needs to know about and
    # what our convention says to document.
]

# Required by the DOC rules above, which ruff still gates behind preview. Verified to add no
# other findings to this repo: every rule selected here behaves the same with it on.
preview = true

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
# Ignore `E402` (import violations) in all `__init__.py` files
"__init__.py" = ["E402"]
# Ignore every `D` rule outside `src/` and `tests/`, which leaves scripts like
# generate_openapi.py and run.py alone.
"!**/{src,tests}/**/*.py" = ["D"]
# A test states what it proves in one sentence and stops there. The signature-matching rules
# would have each test describe the fixtures it takes, repeating each fixture's own docstring
# at every call site, so they are off here - D1 still requires the docstring itself.
"**/tests/**/*.py" = ["D417", "DOC"]
"services/gen3_ai_model_repo/tests/**/*.py" = ["D"]

[lint.pydocstyle]
convention = "google"

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
docstring-code-format = true

# Set the line length limit used when formatting code snippets in
# docstrings.
docstring-code-line-length = "dynamic"

[lint.isort]
known-first-party = ["common", "gen3_inference", "gen3_embeddings", "gen3_ai_model_repo"]
